.dotnetcore-50-slim:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnet-core-5.0-slim/**/*"
    DIR_PATH: "dotnet-core-5.0-slim"
    IMAGE_VERSION: "5.0-slim"
    IMAGE_TAG: "5.0-buster-slim"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/aspnet:$IMAGE_TAG"
    IMAGE_PATH: "rebuild-baseimage/dotnet/core/aspnet:$IMAGE_VERSION"
    # IMAGE_PATH: "base/node:$IMAGE_VERSION"

dotnetcore-50-slim-test:
  extends: [.dotnetcore-50-slim, .test]

dotnetcore-50-slim-build:
  extends: [.dotnetcore-50-slim, .build]
  needs: ["dotnetcore-50-slim-test"]

