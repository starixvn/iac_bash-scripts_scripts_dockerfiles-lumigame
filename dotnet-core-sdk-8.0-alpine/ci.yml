.dotnetcoresdk80-alpine:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnet-core-sdk-8.0-alpine/**/*"
    DIR_PATH: "dotnet-core-sdk-8.0-alpine"
    IMAGE_VERSION: "8.0-alpine"
    IMAGE_TAG: "8.0-alpine"
    BASE_IMAGE: "$DOCKER_REG_URL/base/dotnet/core/sdk:$IMAGE_TAG"
    # IMAGE_PATH: "base/dotnet/core/sdk:$IMAGE_VERSION"
    IMAGE_PATH: "rebuild-baseimage/dotnet/sdk:$IMAGE_VERSION"

dotnetcoresdk80-alpine-test:
  extends: [.dotnetcoresdk80-alpine, .test]

dotnetcoresdk80-alpine-build:
  extends: [.dotnetcoresdk80-alpine, .build]
  needs: ["dotnetcoresdk80-alpine-test"]
