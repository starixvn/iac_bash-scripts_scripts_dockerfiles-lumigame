.dotnetcoresdk80-alpine:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnet-core-sdk-8.0-alpine/**/*"
    DIR_PATH: "dotnet-core-sdk-8.0-alpine"
    IMAGE_VERSION: "8.0-alpine"
    IMAGE_TAG: "8.0-alpine"
    BASE_IMAGE: "$DOCKER_REG_URL/base/dotnet/core/sdk:$IMAGE_TAG"
    # IMAGE_PATH: "base/dotnet/core/sdk:$IMAGE_VERSION"
    IMAGE_PATH: "rebuild-baseimage/dotnet/sdk:$IMAGE_VERSION"

dotnetcoresdk80-alpine-test:
  extends: [.dotnetcoresdk80-alpine, .test]

dotnetcoresdk80-alpine-build:
  extends: [.dotnetcoresdk80-alpine, .build]
  needs: ["dotnetcoresdk80-alpine-test"]

dotnetcoresdk80-alpine-config-scan-reports:
  extends: [.defectdojo_upload, .dotnetcoresdk80-alpine]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "Dockerfile Scan"
  needs:
    - job: dotnetcoresdk80-alpine-test
      artifacts: true
  when: always


dotnetcoresdk80-alpine-image-scan-reports:
  extends: [.defectdojo_upload, .dotnetcoresdk80-alpine]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$IMAGE_PATH - Image Scan"
  needs:
    - job: dotnetcoresdk80-alpine-build
      artifacts: true
  when: always