.node14-15-1-alpine:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "node14-15-1-alpine/**/*"
    DIR_PATH: "node14-15-1-alpine"
    IMAGE_VERSION: "14.15.1-alpine"
    IMAGE_TAG: "14.15.1-alpine3.12"
    BASE_IMAGE: "node:$IMAGE_TAG"
    # IMAGE_PATH: "rebuild-baseimage/node:$IMAGE_VERSION"
    IMAGE_PATH: "base/node:$IMAGE_VERSION-24h1.1"

node14-15-1-alpine-test:
  extends: [.node14-15-1-alpine, .test]

node14-15-1-alpine-build:
  extends: [.node14-15-1-alpine, .build]
  needs: ["node14-15-1-alpine-test"]

node14-15-1-alpine-config-scan-reports:
  extends: [.defectdojo_upload, .node14-15-1-alpine]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "Dockerfile Scan"
  needs:
    - job: node14-15-1-alpine-test
      artifacts: true
  when: always


node14-15-1-alpine-image-scan-reports:
  extends: [.defectdojo_upload, .node14-15-1-alpine]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$IMAGE_PATH - Image Scan"
  needs:
    - job: node14-15-1-alpine-build
      artifacts: true
  when: always