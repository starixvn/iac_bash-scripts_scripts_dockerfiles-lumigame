.node22-alpine:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "node22-alpine/**/*"
    DIR_PATH: "node22-alpine"
    IMAGE_VERSION: "22-alpine"
    IMAGE_TAG: "22-alpine"
    BASE_IMAGE: "node:$IMAGE_TAG"
    # IMAGE_PATH: "rebuild-baseimage/node:$IMAGE_VERSION"
    IMAGE_PATH: "base/node:$IMAGE_VERSION-25h1.1"

node22-alpine-test:
  extends: [.node22-alpine, .test]

node22-alpine-build:
  extends: [.node22-alpine, .build]
  needs: ["node22-alpine-test"]

node22-alpine-config-scan-reports:
  extends: [.defectdojo_upload, .node22-alpine]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan "
  needs:
    - job: node22-alpine-test
      artifacts: true
  when: always


node22-alpine-image-scan-reports:
  extends: [.defectdojo_upload, .node22-alpine]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan "
  needs:
    - job: node22-alpine-build
      artifacts: true
  when: always