.dotnetcore-31-alpine:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnet-core-3.1-alpine/**/*"
    DIR_PATH: "dotnet-core-3.1-alpine"
    IMAGE_VERSION: "3.1-alpine"
    IMAGE_TAG: "3.1-alpine"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/aspnet:$IMAGE_TAG"
    IMAGE_PATH: "rebuild-baseimage/dotnet/core/aspnet:$IMAGE_VERSION"
    # IMAGE_PATH: "base/node:$IMAGE_VERSION"

dotnetcore-31-alpine-test:
  extends: [.dotnetcore-31-alpine, .test]

dotnetcore-31-alpine-build:
  extends: [.dotnetcore-31-alpine, .build]
  needs: ["dotnetcore-31-alpine-test"]

