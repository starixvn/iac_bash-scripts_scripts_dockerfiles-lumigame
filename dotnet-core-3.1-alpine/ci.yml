.dotnetcore-31-alpine:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnet-core-3.1-alpine/**/*"
    DIR_PATH: "dotnet-core-3.1-alpine"
    IMAGE_VERSION: "3.1-alpine-24h1.1"
    IMAGE_TAG: "3.1-alpine"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/aspnet:$IMAGE_TAG"
    IMAGE_PATH: "base/dotnet/core/aspnet:$IMAGE_VERSION"
    # IMAGE_PATH: "base/node:$IMAGE_VERSION"

dotnetcore-31-alpine-test:
  extends: [.dotnetcore-31-alpine, .test]

dotnetcore-31-alpine-build:
  extends: [.dotnetcore-31-alpine, .build]
  needs: ["dotnetcore-31-alpine-test"]

dotnetcore-31-alpine-config-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore-31-alpine]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan "
  needs:
    - job: dotnetcore-31-alpine-test
      artifacts: true
  when: always


dotnetcore-31-alpine-image-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore-31-alpine]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan "
  needs:
    - job: dotnetcore-31-alpine-build
      artifacts: true
  when: always