.dotnetcore-50-alpine:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnet-core-5.0-alpine/**/*"
    DIR_PATH: "dotnet-core-5.0-alpine"
    IMAGE_VERSION: "5.0-alpine"
    IMAGE_TAG: "5.0-alpine"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/aspnet:$IMAGE_TAG"
    IMAGE_PATH: "rebuild-baseimage/dotnet/core/aspnet:$IMAGE_VERSION"
    # IMAGE_PATH: "base/node:$IMAGE_VERSION"

dotnetcore-50-alpine-test:
  extends: [.dotnetcore-50-alpine, .test]

dotnetcore-50-alpine-build:
  extends: [.dotnetcore-50-alpine, .build]
  needs: ["dotnetcore-50-alpine-test"]

