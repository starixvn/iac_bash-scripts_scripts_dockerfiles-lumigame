.node20-9-alpine:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "node20-9-alpine/**/*"
    DIR_PATH: "node20-9-alpine"
    IMAGE_VERSION: "20.9.0-alpine"
    IMAGE_TAG: "20.9.0-alpine"
    BASE_IMAGE: "node:$IMAGE_TAG"
    # IMAGE_PATH: "rebuild-baseimage/node:$IMAGE_VERSION"
    IMAGE_PATH: "base/node:$IMAGE_VERSION-24h1.1"

node20-9-alpine-test:
  extends: [.node20-9-alpine, .test]

node20-9-alpine-build:
  extends: [.node20-9-alpine, .build]
  needs: ["node20-9-alpine-test"]

node20-9-alpine-config-scan-reports:
  extends: [.defectdojo_upload, .node20-9-alpine]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan"
  needs:
    - job: node20-9-alpine-test
      artifacts: true
  when: always


node20-9-alpine-image-scan-reports:
  extends: [.defectdojo_upload, .node20-9-alpine]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan"
  needs:
    - job: node20-9-alpine-build
      artifacts: true
  when: always