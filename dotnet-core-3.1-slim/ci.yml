.dotnetcore-31-slim:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnet-core-3.1-slim/**/*"
    DIR_PATH: "dotnet-core-3.1-slim"
    IMAGE_VERSION: "3.1-slim-24h1.1"
    IMAGE_TAG: "3.1-buster-slim"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/aspnet:$IMAGE_TAG"
    IMAGE_PATH: "base/dotnet/core/aspnet:$IMAGE_VERSION"
    # IMAGE_PATH: "base/node:$IMAGE_VERSION"


dotnetcore-31-slim-test:
  extends: [.dotnetcore-31-slim, .test]

dotnetcore-31-slim-build:
  extends: [.dotnetcore-31-slim, .build]
  needs: ["dotnetcore-31-slim-test"]

dotnetcore-31-slim-config-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore-31-slim]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan"
  needs:
    - job: dotnetcore-31-slim-test
      artifacts: true
  when: always


dotnetcore-31-slim-image-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore-31-slim]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan"
  needs:
    - job: dotnetcore-31-slim-build
      artifacts: true
  when: always