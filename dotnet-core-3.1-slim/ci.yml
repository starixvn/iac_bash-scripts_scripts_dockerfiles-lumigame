.dotnetcore-31-slim:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnet-core-3.1-slim/**/*"
    DIR_PATH: "dotnet-core-3.1-slim"
    IMAGE_VERSION: "3.1-slim-24h1.1"
    IMAGE_TAG: "3.1-buster-slim"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/aspnet:$IMAGE_TAG"
    IMAGE_PATH: "base/dotnet/core/aspnet:$IMAGE_VERSION"
    # IMAGE_PATH: "base/node:$IMAGE_VERSION"

dotnetcore-31-slim-test:
  extends: [.dotnetcore-31-slim, .test]

dotnetcore-31-slim-build:
  extends: [.dotnetcore-31-slim, .build]
  needs: ["dotnetcore-31-slim-test"]

