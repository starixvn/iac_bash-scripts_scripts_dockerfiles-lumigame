.dotnetcore-60-slim:
  # extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnet-core-6.0-slim/**/*"
    DIR_PATH: "dotnet-core-6.0-slim"
    IMAGE_VERSION: "6.0.27-bullseye-slim"
    IMAGE_TAG: "6.0.27-bullseye-slim"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/aspnet:$IMAGE_TAG"
    IMAGE_PATH: "base/dotnet/core/aspnet:$IMAGE_VERSION"
    # IMAGE_PATH: "base/node:$IMAGE_VERSION"

dotnetcore-60-slim-test:
  extends: [.dotnetcore-60-slim, .test]

dotnetcore-60-slim-build:
  extends: [.dotnetcore-60-slim, .build]
  needs: ["dotnetcore-60-slim-test"]

dotnetcore-60-slim-config-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore-60-slim]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Config Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan"
  needs:
    - job: dotnetcore-60-slim-test
      artifacts: true
  when: always

dotnetcore-60-slim-image-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore-60-slim]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Image Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan"
  needs:
    - job: dotnetcore-60-slim-build
      artifacts: true
  when: always