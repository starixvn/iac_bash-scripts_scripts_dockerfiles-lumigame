.logstash:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "logstash/**/*"
    DIR_PATH: "logstash"
    # BASE_IMAGE: "docker.elastic.co/logstash/logstash:8.5.1"
    BASE_IMAGE: "docker.elastic.co/logstash/logstash:7.17.6"
    # BASE_IMAGE: "opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9.0"
    IMAGE_VERSION: "7.17.6"
    IMAGE_PATH: "base/logstash/logstash:$IMAGE_VERSION"
    
logstash-test:
  extends: [.logstash, .test]

logstash-build:
  extends: [.logstash, .build]
  needs: ["logstash-test"]


logstash-config-scan-reports:
  extends: [.defectdojo_upload, .logstash]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan"
  needs:
    - job: logstash-test
      artifacts: true
  when: always


logstash-image-scan-reports:
  extends: [.defectdojo_upload, .logstash]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan"
  needs:
    - job: logstash-build
      artifacts: true
  when: always

