.dotnetcoresdk-alpine:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnet-core-sdk-alpine/**/*"
    DIR_PATH: "dotnet-core-sdk-alpine"
    IMAGE_VERSION: "10.0-alpine-25h2"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/sdk:10.0-alpine"
    IMAGE_PATH: "base/dotnet/core/sdk:$IMAGE_VERSION"

dotnetcoresdk-alpine-test:
  extends: [.dotnetcoresdk-alpine, .test]

dotnetcoresdk-alpine-build:
  extends: [.dotnetcoresdk-alpine, .build]
  needs: ["dotnetcoresdk-alpine-test"]

dotnetcoresdk-alpine-config-scan-reports:
  extends: [.defectdojo_upload, .dotnetcoresdk-alpine]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "Dockerfile Scan"
  needs:
    - job: dotnetcoresdk-alpine-test
      artifacts: true
  when: always


dotnetcoresdk-alpine-image-scan-reports:
  extends: [.defectdojo_upload, .dotnetcoresdk-alpine]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$IMAGE_PATH - Image Scan"
  needs:
    - job: dotnetcoresdk-alpine-build
      artifacts: true
  when: always