.vault-snapshot:
  # extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "vault-snapshot/**/*"
    DIR_PATH: "vault-snapshot"
    BASE_IMAGE: "bitnami/minio-client:2024.8.17"
    IMAGE_VERSION: "2024.8.17"
    IMAGE_PATH: "base/nexops-tools/vault-snapshot:$IMAGE_VERSION"

vault-snapshot-test:
  extends: [.vault-snapshot, .test]

vault-snapshot-build:
  extends: [.vault-snapshot, .build]
  needs: ["vault-snapshot-test"]

vault-snapshot-config-scan-reports:
  extends: [.defectdojo_upload, .vault-snapshot]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan "
  needs:
    - job: vault-snapshot-test
      artifacts: true
  when: always


vault-snapshot-image-scan-reports:
  extends: [.defectdojo_upload, .vault-snapshot]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan "
  needs:
    - job: vault-snapshot-build
      artifacts: true
  when: always