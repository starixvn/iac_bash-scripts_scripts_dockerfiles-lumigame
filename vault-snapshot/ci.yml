.vault-snapshot:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "vault-snapshot/**/*"
    DIR_PATH: "vault-snapshot"
    BASE_IMAGE: "bitnami/minio-client:2024.8.17"
    IMAGE_VERSION: "2024.8.17"
    IMAGE_PATH: "base/nexops-tools/vault-snapshot:$IMAGE_VERSION"

vault-snapshot-test:
  extends: [.vault-snapshot, .test]

vault-snapshot-build:
  extends: [.vault-snapshot, .build]
  needs: ["vault-snapshot-test"]