.node18-1-alpine:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "node18-1-alpine/**/*"
    DIR_PATH: "node18-1-alpine"
    IMAGE_VERSION: "18.1-alpine"
    IMAGE_TAG: "18.1-alpine"
    BASE_IMAGE: "node:$IMAGE_TAG"
    # IMAGE_PATH: "rebuild-baseimage/node:$IMAGE_VERSION"
    IMAGE_PATH: "base/node:$IMAGE_VERSION-24h1.1"

node18-1-alpine-test:
  extends: [.node18-1-alpine, .test]

node18-1-alpine-build:
  extends: [.node18-1-alpine, .build]
  needs: ["node18-1-alpine-test"]

