.node18-1-alpine:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "node18-1-alpine/**/*"
    DIR_PATH: "node18-1-alpine"
    IMAGE_VERSION: "18.1-alpine"
    IMAGE_TAG: "18.1-alpine"
    BASE_IMAGE: "node:$IMAGE_TAG"
    # IMAGE_PATH: "rebuild-baseimage/node:$IMAGE_VERSION"
    IMAGE_PATH: "base/node:$IMAGE_VERSION-24h1.1"

node18-1-alpine-test:
  extends: [.node18-1-alpine, .test]

node18-1-alpine-build:
  extends: [.node18-1-alpine, .build]
  needs: ["node18-1-alpine-test"]

node18-1-alpine-config-scan-reports:
  extends: [.defectdojo_upload, .node18-1-alpine]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan "
  needs:
    - job: node18-1-alpine-test
      artifacts: true
  when: always


node18-1-alpine-image-scan-reports:
  extends: [.defectdojo_upload, .node18-1-alpine]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan "
  needs:
    - job: node18-1-alpine-build
      artifacts: true
  when: always