.nvidia-cuda-ubuntu22:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "nvidia-cuda-ubuntu22/**/*"
    DIR_PATH: "nvidia-cuda-ubuntu22"
    IMAGE_VERSION: "12.5.0-base-ubuntu22.04"
    BASE_IMAGE: "nvcr.io/nvidia/cuda:12.5.0-base-ubuntu22.04"
    IMAGE_PATH: "base/nvidia/cuda:$IMAGE_VERSION"

nvidia-cuda-ubuntu22-test:
  extends: [.nvidia-cuda-ubuntu22, .test]

nvidia-cuda-ubuntu22-build:
  extends: [.nvidia-cuda-ubuntu22, .build]
  needs: ["nvidia-cuda-ubuntu22-test"]

nvidia-cuda-ubuntu22-config-scan-reports:
  extends: [.defectdojo_upload, .nvidia-cuda-ubuntu22]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan"
  needs:
    - job: nvidia-cuda-ubuntu22-test
      artifacts: true
  when: always


nvidia-cuda-ubuntu22-image-scan-reports:
  extends: [.defectdojo_upload, .nvidia-cuda-ubuntu22]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan"
  needs:
    - job: nvidia-cuda-ubuntu22-build
      artifacts: true
  when: always