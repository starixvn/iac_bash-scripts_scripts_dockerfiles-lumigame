.nginx:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "nginx/**/*"
    DIR_PATH: "nginx"
    IMAGE_VERSION: "1.29-alpine-25h2"
    # BASE_IMAGE: "nginx:1.29-alpine-slim"
    BASE_IMAGE: "nginxinc/nginx-unprivileged:1.29-alpine-slim"
    # BASE_IMAGE: "fholzer/nginx-brotli:1.28.0"
    # IMAGE_PATH: "base/nginx:$IMAGE_VERSION"
    IMAGE_PATH: "base/nginx/nginx-unprivileged:$IMAGE_VERSION"
    # IMAGE_PATH: "base/nginx:$IMAGE_VERSION"

nginx-test:
  extends: [.nginx, .test]

nginx-build:
  extends: [.nginx, .build]
  needs: ["nginx-test"]

nginx-config-scan-reports:
  extends: [.defectdojo_upload, .nginx]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "Dockerfile Scan"
  needs:
    - job: nginx-test
      artifacts: true
  when: always


nginx-image-scan-reports:
  extends: [.defectdojo_upload, .nginx]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$IMAGE_PATH - Image Scan "
  needs:
    - job: nginx-build
      artifacts: true
  when: always