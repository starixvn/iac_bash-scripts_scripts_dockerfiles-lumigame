.dotnet-core-alpine:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnet-core-alpine/**/*"
    DIR_PATH: "dotnet-core-alpine"
    IMAGE_VERSION: "8.0-alpine-25h2"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/aspnet:8.0-alpine"
    IMAGE_PATH: "base/dotnet/core/aspnet:$IMAGE_VERSION"

dotnet-core-alpine-test:
  extends: [.dotnet-core-alpine, .test]

dotnet-core-alpine-build:
  extends: [.dotnet-core-alpine, .build]
  needs: ["dotnet-core-alpine-test"]


dotnet-core-alpine-config-scan-reports:
  extends: [.defectdojo_upload, .dotnet-core-alpine]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan "
  needs:
    - job: dotnet-core-alpine-test
      artifacts: true
  when: always


dotnet-core-alpine-image-scan-reports:
  extends: [.defectdojo_upload, .dotnet-core-alpine]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan "
  needs:
    - job: dotnet-core-alpine-build
      artifacts: true
  when: always