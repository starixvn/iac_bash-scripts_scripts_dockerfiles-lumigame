.dotnetcore-70-alpine:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnet-core-7.0-alpine/**/*"
    DIR_PATH: "dotnet-core-7.0-alpine"
    IMAGE_VERSION: "7.0-alpine-24h1.1"
    IMAGE_TAG: "7.0-alpine"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/aspnet:$IMAGE_TAG"
    IMAGE_PATH: "base/dotnet/core/aspnet:$IMAGE_VERSION"
    # IMAGE_PATH: "base/node:$IMAGE_VERSION"

dotnetcore-70-alpine-test:
  extends: [.dotnetcore-70-alpine, .test]

dotnetcore-70-alpine-build:
  extends: [.dotnetcore-70-alpine, .build]
  needs: ["dotnetcore-70-alpine-test"]

dotnetcore-70-alpine-config-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore-70-alpine]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "Dockerfile Scan"
  needs:
    - job: dotnetcore-70-alpine-test
      artifacts: true
  when: always


dotnetcore-70-alpine-image-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore-70-alpine]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$IMAGE_PATH - Image Scan"
  needs:
    - job: dotnetcore-70-alpine-build
      artifacts: true
  when: always