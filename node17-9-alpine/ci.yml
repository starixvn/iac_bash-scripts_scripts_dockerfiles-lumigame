.node17-9-alpine:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "node17-9-alpine/**/*"
    DIR_PATH: "node17-9-alpine"
    IMAGE_VERSION: "17.9-alpine"
    IMAGE_TAG: "17.9.0-alpine3.15"
    BASE_IMAGE: "node:$IMAGE_TAG"
    IMAGE_PATH: "rebuild-baseimage/node:$IMAGE_VERSION"
    # IMAGE_PATH: "base/node:$IMAGE_VERSION"

node17-9-alpine-test:
  extends: [.node17-9-alpine, .test]

node17-9-alpine-build:
  extends: [.node17-9-alpine, .build]
  needs: ["node17-9-alpine-test"]

