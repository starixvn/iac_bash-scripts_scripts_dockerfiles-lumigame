.node18-16-alpine:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "node18-16-alpine/**/*"
    DIR_PATH: "node18-16-alpine"
    IMAGE_VERSION: "18-16-alpine"
    IMAGE_TAG: "18.16-alpine3.18"
    BASE_IMAGE: "node:$IMAGE_TAG"
    IMAGE_PATH: "rebuild-baseimage/node:$IMAGE_VERSION"
    # IMAGE_PATH: "base/node:$IMAGE_VERSION"

node18-16-alpine-test:
  extends: [.node18-16-alpine, .test]

node18-16-alpine-build:
  extends: [.node18-16-alpine, .build]
  needs: ["node18-16-alpine-test"]

