.node18-13-alpine:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "node18-13-alpine/**/*"
    DIR_PATH: "node18-13-alpine"
    IMAGE_VERSION: "18-13-alpine"
    IMAGE_TAG: "18.13-alpine3.17"
    BASE_IMAGE: "node:$IMAGE_TAG"
    IMAGE_PATH: "rebuild-baseimage/node:$IMAGE_VERSION"
    # IMAGE_PATH: "base/node:$IMAGE_VERSION"

node18-13-alpine-test:
  extends: [.node18-13-alpine, .test]

node18-13-alpine-build:
  extends: [.node18-13-alpine, .build]
  needs: ["node18-13-alpine-test"]

