.haproxy:
  # extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "haproxy/**/*"
    DIR_PATH: "haproxy"
    BASE_IMAGE: "haproxytech/haproxy-ubuntu:$IMAGE_VERSION"
    IMAGE_VERSION: "3.1"
    IMAGE_PATH: "base/haproxy/haproxy-ubuntu:$IMAGE_VERSION"
    
haproxy-test:
  extends: [.haproxy, .test]

haproxy-build:
  extends: [.haproxy, .build]
  needs: ["haproxy-test"]

haproxy-config-scan-reports:
  extends: [.defectdojo_upload, .haproxy]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan"
  needs:
    - job: haproxy-test
      artifacts: true
  when: always


haproxy-image-scan-reports:
  extends: [.defectdojo_upload, .haproxy]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan"
  needs:
    - job: haproxy-build
      artifacts: true
  when: always