.dotnetcore-70-slim:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnet-core-7.0-slim/**/*"
    DIR_PATH: "dotnet-core-7.0-slim"
    IMAGE_VERSION: "7.0-slim"
    IMAGE_TAG: "7.0-bookworm-slim"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/aspnet:$IMAGE_TAG"
    IMAGE_PATH: "rebuild-baseimage/dotnet/core/aspnet:$IMAGE_VERSION"
    # IMAGE_PATH: "base/node:$IMAGE_VERSION"

dotnetcore-70-slim-test:
  extends: [.dotnetcore-70-slim, .test]

dotnetcore-70-slim-build:
  extends: [.dotnetcore-70-slim, .build]
  needs: ["dotnetcore-70-slim-test"]