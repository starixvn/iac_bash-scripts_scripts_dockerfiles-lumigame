.nodelts-alpine:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "nodelts-alpine/**/*"
    DIR_PATH: "nodelts-alpine"
    IMAGE_VERSION: "lts-alpine"
    IMAGE_TAG: "lts-alpine3.19"
    BASE_IMAGE: "node:$IMAGE_TAG"
    # IMAGE_PATH: "rebuild-baseimage/node:$IMAGE_VERSION"
    IMAGE_PATH: "base/node:$IMAGE_VERSION-24h1.1"

nodelts-alpine-test:
  extends: [.nodelts-alpine, .test]

nodelts-alpine-build:
  extends: [.nodelts-alpine, .build]
  needs: ["nodelts-alpine-test"]

nodelts-alpine-config-scan-reports:
  extends: [.defectdojo_upload, .nodelts-alpine]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "Dockerfile Scan"
  needs:
    - job: nodelts-alpine-test
      artifacts: true
  when: always


nodelts-alpine-image-scan-reports:
  extends: [.defectdojo_upload, .nodelts-alpine]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$IMAGE_PATH - Image Scan"
  needs:
    - job: nodelts-alpine-build
      artifacts: true
  when: always