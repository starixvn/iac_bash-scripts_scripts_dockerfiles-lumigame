.build:
  stage: build
  script:
    - !reference [.general-script, docker-login]
    - wget --no-verbose https://gitlab.nexdev.net/NEXOPS/tools/trivy-scan/-/raw/main/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz?inline=false -O - | tar -zxvf -
    - wget -O .trivyignore https://gitlab.nexdev.net/NEXOPS/tools/trivy-scan/-/raw/main/trivyignore?inline=false
    - echo "build - $DIR_PATH"
    - echo "docker build --no-cache --build-arg BASE_IMAGE="$BASE_IMAGE" -f $DIR_PATH/Dockerfile -t $DOCKER_REG_URL/$IMAGE_PATH ."
    - docker build --no-cache --build-arg BASE_IMAGE="$BASE_IMAGE" -f $DIR_PATH/Dockerfile -t $DOCKER_REG_URL/$IMAGE_PATH .
    - echo "$DIR_PATH - Build is DONE!";
    - echo "Trivy Scan image $DOCKER_REG_URL/$IMAGE_PATH"
    - echo "$TRIVY_SERVER - $TRIVY_VERSION";

    # First command: Generate a report for HIGH/CRITICAL (no pipeline failure)
    - |
      ./trivy --server $TRIVY_SERVER \
        --cache-dir /tmp/trivy-cache \
        image \
        --ignore-unfixed \
        --vuln-type os \
        --exit-code 0 \
        --severity HIGH,CRITICAL \
        --token $TRIVY_TOKEN \
        --format json \
        --output ${IMAGE_SCAN_REPORT} \
        $DOCKER_REG_URL/$IMAGE_PATH

    #Second command: Fail pipeline for CRITICAL
    - |
      ./trivy --server $TRIVY_SERVER \
        --cache-dir /tmp/trivy-cache \
        image \
        --ignore-unfixed \
        --vuln-type os \
        --exit-code 1 \
        --severity CRITICAL \
        $DOCKER_REG_URL/$IMAGE_PATH

    - echo "done Scan Image $DOCKER_REG_URL/$IMAGE_PATH !"
    - echo "Push - $DOCKER_REG_URL/$IMAGE_PATH"
    - docker push $DOCKER_REG_URL/$IMAGE_PATH
    - echo "$DOCKER_REG_URL/$IMAGE_PATH - Push is DONE!";
  tags:
    - docker
  artifacts:
    when: always
    paths:
      - ${IMAGE_SCAN_REPORT}

# Upload to DefectDojo
.defectdojo_upload:
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  stage: upload
  before_script:
    - apk add --no-cache bash curl jq
  variables:
    TODAY: $(date +%Y-%m-%d)
  script:
    - |
      # ===== Consolidated Validation =====
      REQUIRED_VARS=(
        DEFECTDOJO_URL DEFECTDOJO_API_KEY 
        DEFECTDOJO_PRODUCT_NAME DEFECTDOJO_DEPT
        ENGAGEMENT_NAME DEFECTDOJO_SCAN_FILE
        DEFECTDOJO_TEST_TITLE
      )
      for var in "${REQUIRED_VARS[@]}"; do
        if [ -z "${!var}" ]; then
          echo "❌ Critical error: Missing $var"
          exit 1
        fi
      done

      # ===== API Functions =====
      api_request() {
        local url=$1 method=${2:-GET} data=${3:-} expected_status=$4
        local response=$(curl -sf -w "\nHTTP_STATUS:%{http_code}" \
          -H "Authorization: Token $DEFECTDOJO_API_KEY" \
          -X "$method" \
          ${data:+-d "$data"} \
          "$url")
        
        local status=$(echo "$response" | awk -F: '/HTTP_STATUS/ {print $2}')
        local body=$(echo "$response" | sed '/HTTP_STATUS:/d')
        
        if [ "$status" -ne "$expected_status" ]; then
          echo "❌ API Error: $url (HTTP $status)"
          echo "Response: ${body:0:200}..." # Limited logging
          exit 1
        fi
        
        echo "$body"
      }

      # ===== Product Type Setup =====
      product_type_body=$(api_request \
        "${DEFECTDOJO_URL}/api/v2/product_types/?name=${DEFECTDOJO_DEPT}" \
        "GET" "" 200)
      
      if [ $(echo "$product_type_body" | jq -e '.count > 0') ]; then
        PRODUCT_TYPE_ID=$(echo "$product_type_body" | jq -r '.results[0].id')
      else
        product_type_body=$(api_request \
          "${DEFECTDOJO_URL}/api/v2/product_types/" \
          "POST" \
          "$(jq -n \
            --arg name "$DEFECTDOJO_DEPT" \
            '{name: $name, description: "Auto-created"}')" \
          201)
        PRODUCT_TYPE_ID=$(echo "$product_type_body" | jq -r '.id')
      fi

      # ===== Product Setup =====
      product_body=$(api_request \
        "${DEFECTDOJO_URL}/api/v2/products/?name=${DEFECTDOJO_PRODUCT_NAME}&limit=100" \
        "GET" "" 200)
      
      if [ $(echo "$product_body" | jq -e '.count > 0') ]; then
        PRODUCT_ID=$(echo "$product_body" | jq -r '.results[0].id')
      else
        product_body=$(api_request \
          "${DEFECTDOJO_URL}/api/v2/products/" \
          "POST" \
          "$(jq -n \
            --arg name "$DEFECTDOJO_PRODUCT_NAME" \
            --argjson type "$PRODUCT_TYPE_ID" \
            '{name: $name, prod_type: $type}')" \
          201)
        PRODUCT_ID=$(echo "$product_body" | jq -r '.id')
      fi

      # ===== Engagement Setup =====
      engagement_body=$(api_request \
        "${DEFECTDOJO_URL}/api/v2/engagements/?product=${PRODUCT_ID}&name=${ENGAGEMENT_NAME}&limit=100" \
        "GET" "" 200)
      
      if [ $(echo "$engagement_body" | jq -e '.count > 0') ]; then
        ENGAGEMENT_ID=$(echo "$engagement_body" | jq -r '.results[0].id')
      else
        engagement_body=$(api_request \
          "${DEFECTDOJO_URL}/api/v2/engagements/" \
          "POST" \
          "$(jq -n \
            --arg name "$ENGAGEMENT_NAME" \
            --argjson product "$PRODUCT_ID" \
            --arg start "$TODAY" \
            --arg end "$(date -d "+30 days" +%Y-%m-%d)" \
            '{name: $name, product: $product, target_start: $start, target_end: $end}')" \
          201)
        ENGAGEMENT_ID=$(echo "$engagement_body" | jq -r '.id')
      fi

      # ===== Scan Upload Logic =====
      test_body=$(api_request \
        "${DEFECTDOJO_URL}/api/v2/tests/?engagement=${ENGAGEMENT_ID}&title=${DEFECTDOJO_TEST_TITLE}&limit=100" \
        "GET" "" 200)
      
      if [ $(echo "$test_body" | jq -e '.count > 0') ]; then
        TEST_ID=$(echo "$test_body" | jq -r '.results[0].id')
        api_request \
          "${DEFECTDOJO_URL}/api/v2/reimport-scan/" \
          "POST" \
          "-F test=$TEST_ID \
           -F scan_date=$TODAY \
           -F scan_type=${DEFECTDOJO_SCAN_TYPE} \
           -F file=@${DEFECTDOJO_SCAN_FILE} \
           -F close_old_findings=true" \
          201 >/dev/null
      else
        api_request \
          "${DEFECTDOJO_URL}/api/v2/import-scan/" \
          "POST" \
          "-F engagement=$ENGAGEMENT_ID \
           -F scan_date=$TODAY \
           -F scan_type=${DEFECTDOJO_SCAN_TYPE} \
           -F test_title=${DEFECTDOJO_TEST_TITLE} \
           -F file=@${DEFECTDOJO_SCAN_FILE} \
           -F close_old_findings=false" \
          201 >/dev/null
      fi

      echo "🚀 All operations completed successfully!"
  tags:
    - docker
  rules:
    - when: on_success




