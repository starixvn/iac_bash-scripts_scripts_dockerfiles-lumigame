.node14-16-alpine:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "node14-16-alpine/**/*"
    DIR_PATH: "node14-16-alpine"
    IMAGE_VERSION: "14.16-alpine"
    IMAGE_TAG: "14.16-alpine3.13"
    BASE_IMAGE: "node:$IMAGE_TAG"
    # IMAGE_PATH: "rebuild-baseimage/node:$IMAGE_VERSION"
    IMAGE_PATH: "base/node:$IMAGE_VERSION-24h1.1"

node14-16-alpine-test:
  extends: [.node14-16-alpine, .test]

node14-16-alpine-build:
  extends: [.node14-16-alpine, .build]
  needs: ["node14-16-alpine-test"]

