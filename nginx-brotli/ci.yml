.nginxbrotli:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "nginx-brotli/**/*"
    DIR_PATH: "nginx-brotli"
    IMAGE_VERSION: "1.28-alpine-25h2"
    BASE_IMAGE: "fholzer/nginx-brotli:1.28.0"
    IMAGE_PATH: "base/nginx/nginx-brotli:$IMAGE_VERSION"

nginxbrotli-test:
  extends: [.nginxbrotli, .test]

nginxbrotli-build:
  extends: [.nginxbrotli, .build]
  needs: ["nginxbrotli-test"]

nginxbrotli-config-scan-reports:
  extends: [.defectdojo_upload, .nginxbrotli]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "Dockerfile Scan"
  needs:
    - job: nginxbrotli-test
      artifacts: true
  when: always


nginxbrotli-image-scan-reports:
  extends: [.defectdojo_upload, .nginxbrotli]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$IMAGE_PATH - Image Scan "
  needs:
    - job: nginxbrotli-build
      artifacts: true
  when: always