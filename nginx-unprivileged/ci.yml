.nginxunprivileged:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "nginx-unprivileged/**/*"
    DIR_PATH: "nginx-unprivileged"
    IMAGE_VERSION: "1.29-alpine-25h2"
    BASE_IMAGE: "nginxinc/nginx-unprivileged:1.29-alpine-slim"
    IMAGE_PATH: "base/nginx/nginx-unprivileged:$IMAGE_VERSION"

nginxunprivileged-test:
  extends: [.nginxunprivileged, .test]

nginxunprivileged-build:
  extends: [.nginxunprivileged, .build]
  needs: ["nginxunprivileged-test"]

nginxunprivileged-config-scan-reports:
  extends: [.defectdojo_upload, .nginxunprivileged]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "Dockerfile Scan"
  needs:
    - job: nginxunprivileged-test
      artifacts: true
  when: always


nginxunprivileged-image-scan-reports:
  extends: [.defectdojo_upload, .nginxunprivileged]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$IMAGE_PATH - Image Scan "
  needs:
    - job: nginxunprivileged-build
      artifacts: true
  when: always