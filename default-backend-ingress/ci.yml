.default-backend-ingress:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "default-backend-ingress/**/*"
    DIR_PATH: "default-backend-ingress"
    BASE_IMAGE: "nginx:mainline-alpine"
    IMAGE_VERSION: "latest"
    IMAGE_PATH: "base/nexops-tools/default-backend-ingress:$IMAGE_VERSION"

default-backend-ingress-test:
  extends: [.default-backend-ingress, .test]

default-backend-ingress-build:
  extends: [.default-backend-ingress, .build]
  needs: ["default-backend-ingress-test"]

default-backend-ingress-config-scan-reports:
  extends: [.defectdojo_upload, .default-backend-ingress]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "Dockerfile Scan"
  needs:
    - job: default-backend-ingress-test
      artifacts: true
  when: always


default-backend-ingress-image-scan-reports:
  extends: [.defectdojo_upload, .default-backend-ingress]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$IMAGE_PATH - Image Scan"
  needs:
    - job: default-backend-ingress-build
      artifacts: true
  when: always