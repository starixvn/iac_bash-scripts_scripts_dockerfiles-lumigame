.netshoot:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "netshoot/**/*"
    DIR_PATH: "netshoot"
    IMAGE_VERSION: "bookworm"
    BASE_IMAGE: "debian:bookworm"
    IMAGE_PATH: "base/netshoot:$IMAGE_VERSION"

netshoot-test:
  extends: [.netshoot, .test]

netshoot-build:
  extends: [.netshoot, .build]
  needs: ["netshoot-test"]


netshoot-config-scan-reports:
  extends: [.defectdojo_upload, .netshoot]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan"
  needs:
    - job: netshoot-test
      artifacts: true
  when: always


netshoot-image-scan-reports:
  extends: [.defectdojo_upload, .netshoot]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan"
  needs:
    - job: netshoot-build
      artifacts: true
  when: always